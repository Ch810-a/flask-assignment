{% extends 'base.html' %}
{% block content %}

<a href="/new_user" class="btn btn-primary mb-3">Add New User</a>

<table class="table table-bordered">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user.id }}</td>
        <td><a href="/users/{{ user.id }}">{{ user.name }}</a></td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
